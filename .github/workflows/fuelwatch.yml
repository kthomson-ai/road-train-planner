name: FuelWatch prices
on:
  schedule:
    - cron: '10 22 * * *'   # 6:10 am Perth, after the day's prices take effect
    - cron: '50 6 * * *'    # 2:50 pm Perth, after tomorrow's prices are published
  workflow_dispatch:
permissions:
  contents: write
concurrency: fuelwatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p rigroute/data && python tools/fuelwatch.py rigroute/data/fuel.json
      - name: Commit if changed
        run: |
          git config user.name "fuelwatch-bot"
          git config user.email "fuelwatch-bot@users.noreply.github.com"
          git add rigroute/data/fuel.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Fuel prices $(TZ=Australia/Perth date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main && git push
